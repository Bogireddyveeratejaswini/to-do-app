<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TO - DO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="bg-layer" aria-hidden="true">
    <span class="bg-orb orb-blue"></span>
    <span class="bg-orb orb-purple"></span>
    <span class="bg-orb orb-pink"></span>
    <span class="bg-grid"></span>
</div>

<div class="app-shell auth-shell">
<div class="container py-5">

    <header class="mb-4 text-center">
        <h1>TO - DO</h1>
        <p>Login to see your tasks.</p>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash-msg flash-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <div class="main-card">
        <h4>Login</h4>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <input type="email" name="email" class="form-control"
                       placeholder="Email" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <input type="password" name="password" class="form-control"
                       placeholder="Password" autocomplete="current-password" required>
            </div>

            <button class="btn btn-primary w-100">Login</button>
        </form>

        <p class="text-center mt-3 mb-0">
            New here? <a href="{{ url_for('register') }}" class="auth-link">Create an account</a>
        </p>
    </div>

</div>
</div>

</body>
</html>
